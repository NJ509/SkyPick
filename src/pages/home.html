<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyPick</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- SkyPick CSS -->
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- ==================== Navbar ==================== -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="./home.html">SkyPick</a>

            <div class="navbar-nav">
                <a class="nav-link active" href="./home.html">예측</a>
                <a class="nav-link" href="./prediction.html">예측 리스트</a>
                <a class="nav-link" href="./shop.html">상점</a>
                <a class="nav-link" href="./collection.html">도감</a>
                <a class="nav-link" href="./ranking.html">랭킹</a>
            </div>

            <div class="user-info">
                <span class="point">1,250 P</span>
                <button class="profile-btn">프로필</button>
            </div>
        </div>
    </nav>

    <!-- ==================== Main ==================== -->
    <main>
        <!-- 페이지 제목 -->
        <section class="hero">
            <div class="container">
                <h1>오늘은 어떤 날씨일까요?</h1>
                <p class="hero-description">날씨를 예측하고 포인트를 획득해보세요.</p>
            </div>
        </section>

        <!-- ==================== 메인 콘텐츠 ==================== -->

        <section class="main-section">
            <div class="container">
                <div class="row g-4">

                    <!-- ==================== 왼쪽 ==================== -->
                    <div class="col-lg-7">
                        <!-- 지도 -->
                        <div class="map-card">
                            <div class="map-header">
                                <div>
                                    <span>예측 지역</span>
                                    <h2>서울</h2>
                                </div>
                                <button class="region-btn">지역 선택</button>
                            </div>


                            <!-- 나중에 지도 API  -->
                            <div class="map">
                                <div class="map-placeholder">
                                    <p>지도 API</p>
                                </div>
                            </div>
                        </div>


                        <!-- ==================== 현재 날씨 ==================== -->

                        <div class="weather-card">
                            <div class="weather-header">
                                <div>
                                    <span class="weather-label">현재 날씨</span>
                                    <h2>서울</h2>
                                </div>

                                <span class="weather-date">2026.09.09</span>
                            </div>


                            <!-- 날씨 메인 -->

                            <div class="weather-main">
                                <div class="weather-icon">☀️</div>
                                <div class="temperature">24°</div>
                                <div class="weather-status">맑음</div>
                            </div>


                            <!-- 날씨 상세 정보 -->

                            <div class="weather-detail">
                                <div>
                                    <span>강수확률</span>
                                    <strong>20%</strong>
                                </div>

                                <div>
                                    <span>습도</span>
                                    <strong>55%</strong>
                                </div>

                                <div>
                                    <span>강수량</span>
                                    <strong>0mm</strong>
                                </div>
                            </div>
                        </div>
                    </div>



                    <!-- ==================== 오른쪽 ==================== -->

                    <div class="col-lg-5">


                        <!-- 날씨 예측 -->

                        <div class="prediction-card">
                            <div class="prediction-title">
                                <h2>날씨 예측</h2>
                                <p>미래의 날씨를 예측해보세요.</p>
                            </div>

                            <!-- 지역 -->

                            <div class="form-group">

                                <label for="region">
                                    예측 지역
                                </label>

                                <select id="region" class="form-select">
                                    <option>서울</option>
                                    <option>인천</option>
                                    <option>경기</option>
                                    <option>강원</option>
                                    <option>충청</option>
                                    <option>대전</option>
                                </select>
                            </div>

                            <!-- 예측 시간 -->

                            <div class="form-group">
                                <label for="prediction-time">예측 시간</label>
                                <input type="datetime-local" id="prediction-time" class="form-control">
                                <small>최소 2시간 이후의 시간을 선택해주세요.</small>
                            </div>



                            <!-- 예측 대상 -->
                            <div class="form-group">
                                <label>예측 대상</label>
                                <div class="prediction-types">
                                    <button type="button" class="prediction-type active">날씨</button>
                                    <button type="button" class="prediction-type">기온</button>
                                    <button type="button" class="prediction-type">습도</button>
                                    <button type="button" class="prediction-type">강수량</button>
                                </div>
                            </div>



                            <!-- 예측값 -->

                            <div class="form-group">
                                <label for="prediction-value">내 예측</label>

                                <select
                                    id="prediction-value"
                                    class="form-select"
                                >
                                    <option>맑음</option>
                                    <option>비</option>
                                    <option>흐림</option>
                                    <option>눈</option>
                                    <option>우박</option>

                                </select>

                            </div>



                            <!-- 배팅 -->

                            <div class="form-group">

                                <div class="betting-header">
                                    <label for="betting">배팅 포인트</label>
                                    <strong>0 P</strong>
                                </div>


                                <input
                                    type="range"
                                    id="betting"
                                    class="form-range"
                                    min="0"
                                    max="1000"
                                    value="0"
                                >


                                <div class="betting-info">
                                    <span>미배팅</span>
                                    <span>최대 1,000 P</span>
                                </div>

                            </div>



                            <!-- 예상 보상 -->
                            <div class="reward-box">

                                <div>
                                    <span>예측 성공 시</span>
                                    <strong>+100 P</strong>
                                </div>

                                <p>포인트를 걸지 않은 예측의 기본 보상입니다.</p>

                            </div>

                            <!-- 예측 버튼 -->
                            <button type="button" class="submit-btn">예측하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
