<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .hero {
            padding: 50px 0 35px;
        }

        .hero h1 {
            margin-bottom: 12px;
            font-size: 40px;
            font-weight: 800;
        }

        .hero-description {
            margin: 0;
            color: #2563eb;
        }

        .main-section {
            padding-bottom: 80px;
        }

        .map-card {
            margin-bottom: 20px;
            padding: 24px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.05);
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .map-header span {
            color: #9ca3af;
            font-size: 14px;
        }

        .map-header h2 {
            margin: 4px 0 0;
            font-size: 24px;
            font-weight: 700;
        }

        .region-btn {
            padding: 8px 14px;
            border: 1px solid #dbe1ea;
            border-radius: 10px;
            background-color: white;
            color: #4b5563;
            font-weight: 500;
        }

        .region-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .map {
            width: 100%;
            height: 440px;
            overflow: hidden;
            border-radius: 15px;
            background-color: #eef2f7;
        }

        .map-placeholder {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #9ca3af;
        }

        .map-placeholder span {
            font-size: 50px;
        }

        .map-placeholder p {
            margin: 10px 0 4px;
            font-size: 18px;
            font-weight: 600;
        }

        .weather-card {
            padding: 25px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.05);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-label {
            color: #9ca3af;
            font-size: 14px;
        }

        .weather-header h2 {
            margin: 4px 0 0;
            font-size: 24px;
        }

        .weather-date {
            color: #9ca3af;
            font-size: 14px;
        }

        .weather-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 25px 0;
        }

        .weather-icon {
            font-size: 52px;
        }

        .temperature {
            font-size: 55px;
            font-weight: 800;
        }

        .weather-status {
            color: #6b7280;
            font-size: 18px;
        }

        .weather-detail {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding-top: 20px;
            border-top: 1px solid #edf0f5;
        }

        .weather-detail div {
            text-align: center;
        }

        .weather-detail span {
            display: block;
            margin-bottom: 5px;
            color: #9ca3af;
            font-size: 13px;
        }

        .weather-detail strong {
            font-size: 17px;
        }

        .prediction-card {
            padding: 30px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.05);
        }

        .prediction-title {
            margin-bottom: 28px;
        }

        .prediction-title h2 {
            margin-bottom: 7px;
            font-size: 26px;
            font-weight: 700;
        }

        .prediction-title p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 23px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group small {
            display: block;
            margin-top: 7px;
            color: #9ca3af;
            font-size: 12px;
        }

        .prediction-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .prediction-type {
            padding: 12px;
            border: 1px solid #dfe3eb;
            border-radius: 10px;
            background-color: white;
            color: #4b5563;
            font-weight: 600;
        }

        .prediction-type:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .prediction-type.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #2563eb;
        }

        .betting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .betting-header label {
            margin-bottom: 0;
        }

        .betting-header strong {
            color: #2563eb;
        }

        .betting-info {
            display: flex;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 12px;
        }

        .reward-box {
            margin: 25px 0;
            padding: 17px;
            border-radius: 12px;
            background-color: #f5f7ff;
        }

        .reward-box div {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reward-box span {
            font-weight: 600;
        }

        .reward-box strong {
            color: #2563eb;
            font-size: 18px;
        }

        .reward-box p {
            margin: 6px 0 0;
            color: #9ca3af;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 991px) {
            .navbar {
                height: auto;
                padding: 15px 0;
            }

            .navbar-nav {
                margin: 15px 0;
                flex-direction: column;
                gap: 5px;
            }

            .user-info {
                margin-top: 10px;
            }

            .hero {
                padding-top: 35px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .map {
                height: 350px;
            }
        }

        @media (max-width: 576px) {
            .hero h1 {
                font-size: 27px;
            }

            .map-card,
            .weather-card,
            .prediction-card {
                padding: 20px;
            }

            .map {
                height: 300px;
            }

            .weather-main {
                gap: 10px;
            }

            .temperature {
                font-size: 45px;
            }

            .weather-icon {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <!-- ==================== Navbar ==================== -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="./home.html">SkyPick</a>

            <div class="navbar-nav">
                <a class="nav-link active" href="./home.html">예측</a>
                <a class="nav-link" href="./prediction.html">예측 리스트</a>
                <a class="nav-link" href="./shop.html">상점</a>
                <a class="nav-link" href="./collection.html">도감</a>
                <a class="nav-link" href="./ranking.html">랭킹</a>
            </div>

            <div class="user-info">
                <span class="point">1,250 P</span>
                <button class="profile-btn">프로필</button>
            </div>
        </div>
    </nav>

    <!-- ==================== Main ==================== -->
    <main>
        <!-- 페이지 제목 -->
        <section class="hero">
            <div class="container">
                <h1>오늘은 어떤 날씨일까요?</h1>
                <p class="hero-description">날씨를 예측하고 포인트를 획득해보세요.</p>
            </div>
        </section>

        <!-- ==================== 메인 콘텐츠 ==================== -->

        <section class="main-section">
            <div class="container">
                <div class="row g-4">

                    <!-- ==================== 왼쪽 ==================== -->
                    <div class="col-lg-7">
                        <!-- 지도 -->
                        <div class="map-card">
                            <div class="map-header">
                                <div>
                                    <span>예측 지역</span>
                                    <h2>서울</h2>
                                </div>
                                <button class="region-btn">지역 선택</button>
                            </div>


                            <!-- 나중에 지도 API  -->
                            <div class="map">
                                <div class="map-placeholder">
                                    <p>지도 API</p>
                                </div>
                            </div>
                        </div>


                        <!-- ==================== 현재 날씨 ==================== -->

                        <div class="weather-card">
                            <div class="weather-header">
                                <div>
                                    <span class="weather-label">현재 날씨</span>
                                    <h2>서울</h2>
                                </div>

                                <span class="weather-date">2026.09.09</span>
                            </div>


                            <!-- 날씨 메인 -->

                            <div class="weather-main">
                                <div class="weather-icon">☀️</div>
                                <div class="temperature">24°</div>
                                <div class="weather-status">맑음</div>
                            </div>


                            <!-- 날씨 상세 정보 -->

                            <div class="weather-detail">
                                <div>
                                    <span>강수확률</span>
                                    <strong>20%</strong>
                                </div>

                                <div>
                                    <span>습도</span>
                                    <strong>55%</strong>
                                </div>

                                <div>
                                    <span>강수량</span>
                                    <strong>0mm</strong>
                                </div>
                            </div>
                        </div>
                    </div>



                    <!-- ==================== 오른쪽 ==================== -->

                    <div class="col-lg-5">


                        <!-- 날씨 예측 -->

                        <div class="prediction-card">
                            <div class="prediction-title">
                                <h2>날씨 예측</h2>
                                <p>미래의 날씨를 예측해보세요.</p>
                            </div>

                            <!-- 지역 -->

                            <div class="form-group">

                                <label for="region">
                                    예측 지역
                                </label>

                                <select id="region" class="form-select">
                                    <option>서울</option>
                                    <option>인천</option>
                                    <option>경기</option>
                                    <option>강원</option>
                                    <option>충청</option>
                                    <option>대전</option>
                                </select>
                            </div>

                            <!-- 예측 시간 -->

                            <div class="form-group">
                                <label for="prediction-time">예측 시간</label>
                                <input type="datetime-local" id="prediction-time" class="form-control">
                                <small>최소 2시간 이후의 시간을 선택해주세요.</small>
                            </div>



                            <!-- 예측 대상 -->
                            <div class="form-group">
                                <label>예측 대상</label>
                                <div class="prediction-types">
                                    <button type="button" class="prediction-type active">날씨</button>
                                    <button type="button" class="prediction-type">기온</button>
                                    <button type="button" class="prediction-type">습도</button>
                                    <button type="button" class="prediction-type">강수량</button>
                                </div>
                            </div>



                            <!-- 예측값 -->

                            <div class="form-group">
                                <label for="prediction-value">내 예측</label>

                                <select
                                    id="prediction-value"
                                    class="form-select"
                                >
                                    <option>맑음</option>
                                    <option>비</option>
                                    <option>흐림</option>
                                    <option>눈</option>
                                    <option>우박</option>

                                </select>

                            </div>



                            <!-- 배팅 -->

                            <div class="form-group">

                                <div class="betting-header">
                                    <label for="betting">배팅 포인트</label>
                                    <strong>0 P</strong>
                                </div>


                                <input
                                    type="range"
                                    id="betting"
                                    class="form-range"
                                    min="0"
                                    max="1000"
                                    value="0"
                                >


                                <div class="betting-info">
                                    <span>미배팅</span>
                                    <span>최대 1,000 P</span>
                                </div>

                            </div>



                            <!-- 예상 보상 -->
                            <div class="reward-box">

                                <div>
                                    <span>예측 성공 시</span>
                                    <strong>+100 P</strong>
                                </div>

                                <p>포인트를 걸지 않은 예측의 기본 보상입니다.</p>

                            </div>

                            <!-- 예측 버튼 -->
                            <button type="button" class="submit-btn">예측하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
