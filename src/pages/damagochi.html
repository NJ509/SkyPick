<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick - 다마고치</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .damagochi-container {
            min-height: calc(100vh - 72px);
            padding: 25px 30px 40px;
        }

        .damagochi-header { margin-bottom: 20px; }
        .damagochi-header h1 { margin: 0; font-size: 40px; font-weight: 800; }
        .damagochi-header p { margin: 6px 0 0; color: #2563eb; font-size: 13px; }

        .damagochi-content {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
            gap: 20px;
            align-items: start;
        }

        .damagochi-room, .damagochi-panel {
            min-width: 0;
            padding: 24px;
            border: 1px solid #e9edf2;
            border-radius: 14px;
            background: #fff;
        }

        .damagochi-room-header, .damagochi-exp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .damagochi-room-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .damagochi-level {
            flex-shrink: 0;
            padding: 7px 12px;
            border-radius: 20px;
            background: #eef2ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
        }

        .damagochi-stage {
            position: relative;
            height: 290px;
            margin: 20px 0 24px;
            overflow: hidden;
            border-radius: 12px;
            background: linear-gradient(#eaf3ff, #f6faff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 38px;
        }

        .damagochi-sun {
            position: absolute;
            top: 24px;
            right: 28px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffdf8b;
            box-shadow: 0 0 0 10px #ffedbd66;
        }

        .damagochi-speech {
            position: relative;
            z-index: 1;
            max-width: calc(100% - 40px);
            margin: 0;
            padding: 9px 15px;
            border-radius: 18px;
            background: #fff;
            color: #596779;
            font-size: 12px;
            text-align: center;
            box-shadow: 0 3px 12px #3b6eaa0a;
        }

        .damagochi-cloud {
            position: relative;
            width: 150px;
            height: 82px;
            border-radius: 50px;
            background: #fff;
            filter: drop-shadow(0 8px 0 #dce8f5);
            animation: damagochi-float 3s ease-in-out infinite;
        }

        .damagochi-cloud::before, .damagochi-cloud::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: #fff;
        }

        .damagochi-cloud::before { width: 80px; height: 80px; top: -35px; left: 20px; }
        .damagochi-cloud::after { width: 60px; height: 60px; top: -20px; right: 10px; }
        .damagochi-face { position: absolute; z-index: 1; inset: 20px 0 0; }
        .damagochi-eye { position: absolute; top: 0; width: 7px; height: 10px; border-radius: 50%; background: #344258; }
        .damagochi-eye.left { left: 49px; }
        .damagochi-eye.right { right: 49px; }
        .damagochi-smile { position: absolute; top: 13px; left: 65px; width: 20px; height: 12px; border: 3px solid #344258; border-top: 0; border-radius: 0 0 15px 15px; }
        .damagochi-cheek { position: absolute; top: 13px; width: 15px; height: 8px; border-radius: 50%; background: #ffd5d9; }
        .damagochi-cheek.left { left: 30px; }
        .damagochi-cheek.right { right: 30px; }
        .damagochi-shadow { position: absolute; bottom: 34px; width: 125px; height: 14px; border-radius: 50%; background: #cfdeef80; }

        .damagochi-effect { position: absolute; z-index: 2; pointer-events: none; opacity: 0; }
        .damagochi-food { top: calc(50% + 8px); left: calc(50% - 24px); font-size: 42px; }
        .is-feeding .damagochi-food { opacity: 1; animation: damagochi-bite 1.2s ease-in-out infinite; }
        .is-feeding .damagochi-cloud { animation: damagochi-hop .4s ease-in-out infinite; }
        .is-feeding .damagochi-smile { background: #344258; animation: damagochi-chew .3s ease-in-out infinite alternate; }
        .damagochi-heart { top: 50%; color: #f58a9c; font-size: 25px; }
        .damagochi-heart.first { left: calc(50% - 110px); }
        .damagochi-heart.second { left: calc(50% + 85px); font-size: 19px; }
        .is-feeding .damagochi-heart { opacity: 1; animation: damagochi-heart 1.2s ease-out infinite; }
        .is-feeding .damagochi-heart.second { animation-delay: -.6s; }

        .damagochi-bath { inset: 0; }
        .is-washing .damagochi-bath { opacity: 1; }
        .is-washing .damagochi-cloud { animation: damagochi-wiggle .5s ease-in-out infinite; }
        .is-washing .damagochi-eye { height: 4px; top: 5px; border-radius: 5px; }
        .damagochi-shower { position: absolute; top: 28%; left: calc(50% + 65px); font-size: 44px; transform: rotate(-15deg); }
        .damagochi-drop { position: absolute; top: 43%; left: calc(50% + 60px); width: 5px; height: 15px; border-radius: 5px; background: #7ac5f9; opacity: 0; }
        .damagochi-drop.second { left: calc(50% + 30px); animation-delay: -.25s !important; }
        .damagochi-drop.third { left: 50%; animation-delay: -.5s !important; }
        .is-washing .damagochi-drop { animation: damagochi-rain .8s linear infinite; }
        .damagochi-bubble { position: absolute; top: 67%; left: calc(50% - 90px); width: 32px; height: 32px; border: 1px solid #8ccbf3; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #fff 8%, #d7f1ff99 35%, #99d8fb55); box-shadow: inset 0 -3px 7px #b9ddfa66; opacity: 0; }
        .damagochi-bubble.second { left: calc(50% + 70px); width: 40px; height: 40px; animation-delay: -.5s !important; }
        .damagochi-bubble.third { left: calc(50% - 40px); width: 19px; height: 19px; animation-delay: -.9s !important; }
        .damagochi-bubble.fourth { left: calc(50% + 20px); width: 24px; height: 24px; animation-delay: -.3s !important; }
        .is-washing .damagochi-bubble { animation: damagochi-bubble 1.6s ease-out infinite; }

        .damagochi-reward { top: 16px; left: 16px; padding: 8px 13px; border-radius: 20px; background: #2563eb; color: #fff; font-size: 12px; font-weight: 800; }
        .is-rewarding .damagochi-reward { opacity: 1; animation: damagochi-reward .4s ease-out; }
        .is-leveling { box-shadow: inset 0 0 0 2px #f4d578; }
        .is-leveling .damagochi-reward { background: #fef3c7; color: #92400e; }

        .damagochi-exp-header { margin-bottom: 9px; font-size: 12px; }
        .damagochi-exp-header strong { color: #2563eb; }
        .damagochi-exp-bar { display: block; width: 100%; height: 10px; overflow: hidden; border: 0; border-radius: 10px; background: #edf1f7; accent-color: #2563eb; }
        .damagochi-exp-bar::-webkit-progress-bar { background: #edf1f7; border-radius: 10px; }
        .damagochi-exp-bar::-webkit-progress-value { background: #2563eb; border-radius: 10px; transition: width .3s; }
        .damagochi-exp-bar::-moz-progress-bar { background: #2563eb; border-radius: 10px; }
        .damagochi-exp-note { margin: 9px 0 0; color: #9299a2; font-size: 11px; }

        .damagochi-panel + .damagochi-panel { margin-top: 16px; }
        .damagochi-panel h2 { margin: 0 0 6px; font-size: 17px; font-weight: 800; }
        .damagochi-panel p { margin: 0 0 18px; color: #737b84; font-size: 12px; line-height: 1.7; }
        .damagochi-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .damagochi-action {
            padding: 20px 8px;
            border: 1px solid #e1e8f2;
            border-radius: 11px;
            background: #f7faff;
            color: #202938;
            cursor: pointer;
        }

        .damagochi-action span { display: block; margin-bottom: 9px; font-size: 28px; }
        .damagochi-action strong { display: block; margin-bottom: 5px; font-size: 14px; }
        .damagochi-action small { color: #737b84; font-size: 11px; }
        .damagochi-action:hover { border-color: #2563eb; background: #eef4ff; }
        .damagochi-panel .damagochi-care-note { margin: 14px 0 0; font-size: 11px; }

        .damagochi-name-form label { display: block; margin: 16px 0 7px; color: #737b84; font-size: 12px; }
        .damagochi-name-row { display: flex; gap: 8px; }
        .damagochi-name-row input { flex: 1; min-width: 0; height: 38px; padding: 0 11px; border: 1px solid #e1e6eb; border-radius: 8px; font: inherit; font-size: 13px; }
        .damagochi-button { padding: 9px 14px; border: 0; border-radius: 8px; background: #20252b; color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }
        .damagochi-button:hover { background: #343a40; color: #fff; }
        .damagochi-page button:focus-visible, .damagochi-page input:focus-visible, .damagochi-page a:focus-visible { outline: 3px solid #93b8ff; outline-offset: 3px; }
        .damagochi-message { min-height: 20px; margin: 0 0 12px; color: #596779; font-size: 13px; }
        .damagochi-message.error { color: #c24136; }
        .damagochi-notice { margin-bottom: 16px; padding: 18px 20px; border: 1px solid #dce6f6; border-radius: 12px; background: #fff; }
        .damagochi-notice p { margin: 0 0 12px; font-size: 13px; }
        #damagochi-retry { margin-bottom: 16px; }

        @keyframes damagochi-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes damagochi-hop { 50% { transform: translateY(-13px); } }
        @keyframes damagochi-wiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
        @keyframes damagochi-bite { 0% { transform: translate(120px, -60px) rotate(25deg); opacity: 0; } 20% { opacity: 1; } 65% { transform: translate(0, 0) rotate(-10deg) scale(.8); opacity: 1; } 85%, 100% { transform: translate(0, 0) scale(0); opacity: 0; } }
        @keyframes damagochi-chew { to { transform: scale(.65, 1.5); border-radius: 50%; } }
        @keyframes damagochi-heart { 0% { transform: translateY(15px) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-65px) scale(1.1); opacity: 0; } }
        @keyframes damagochi-rain { 0% { transform: translate(15px, -30px) rotate(25deg); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(-40px, 80px) rotate(25deg); opacity: 0; } }
        @keyframes damagochi-bubble { 0% { transform: translateY(25px) scale(.4); opacity: 0; } 25% { opacity: .9; } 100% { transform: translateY(-115px) scale(1.2); opacity: 0; } }
        @keyframes damagochi-reward { from { transform: translateY(12px) scale(.85); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        @media (max-width: 991px) {
            .damagochi-page .navbar { height: auto; min-height: 72px; }
            .damagochi-page .navbar > .container { gap: 12px; padding-top: 12px; padding-bottom: 12px; }
            .damagochi-page .navbar-nav { order: 3; width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px 18px; }
            .damagochi-page .user-info { margin-left: auto; }
            .damagochi-content { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .damagochi-container { padding: 20px 15px 30px; }
            .damagochi-header h1 { font-size: 32px; }
            .damagochi-room, .damagochi-panel { padding: 20px; }
            .damagochi-stage { height: 260px; }
            .damagochi-page .nav-link { font-size: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .damagochi-stage * { animation: none !important; }
            .damagochi-exp-bar::-webkit-progress-value { transition: none; }
        }
    </style>
</head>
<body class="damagochi-page">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="./home.html">SkyPick</a>
            <div class="navbar-nav">
                <a class="nav-link" href="./home.html">예측</a>
                <a class="nav-link" href="./prediction.html">예측 리스트</a>
                <a class="nav-link" href="./shop.html">상점</a>
                <a class="nav-link" href="./collection.html">도감</a>
                <a class="nav-link active" href="./damagochi.html" aria-current="page">다마고치</a>
                <a class="nav-link" href="./ranking.html">랭킹</a>
            </div>
            <div class="user-info">
                <span id="user-point" class="point">- P</span>
                <button class="profile-btn">프로필</button>
            </div>
        </div>
    </nav>

    <main id="damagochi-main" class="container damagochi-container">
        <div class="damagochi-header">
            <h1>다마고치</h1>
        </div>

        <p id="damagochi-message" class="damagochi-message" role="status" aria-live="polite">다마고치를 불러오는 중입니다.</p>
        <div id="damagochi-empty" class="damagochi-notice" hidden>
            <p>아직 다마고치가 없어요. 새로운 구름 친구를 만나보세요.</p>
            <button id="damagochi-create-button" class="damagochi-button" type="button" onclick="createDamagochi()">다마고치 만들기</button>
        </div>
        <div id="damagochi-login" class="damagochi-notice" hidden>
            <p>로그인하고 나만의 다마고치를 만나보세요.</p>
            <a class="damagochi-button" href="./login.html">로그인하기</a>
        </div>
        <button id="damagochi-retry" class="damagochi-button" type="button" onclick="loadDamagochi()" hidden>다시 불러오기</button>

        <div class="damagochi-content">
            <section class="damagochi-room" aria-labelledby="damagochi-name">
                <div class="damagochi-room-header">
                    <h2 id="damagochi-name">나의 다마고치</h2>
                    <span id="damagochi-level" class="damagochi-level">Lv. -</span>
                </div>
                <div id="damagochi-stage" class="damagochi-stage">
                    <div class="damagochi-sun" aria-hidden="true"></div>
                    <p id="damagochi-speech" class="damagochi-speech">어떤 친구를 만나게 될까요?</p>
                    <div class="damagochi-cloud" role="img" aria-label="하얀 구름 다마고치">
                        <div class="damagochi-face" aria-hidden="true">
                            <span class="damagochi-eye left"></span><span class="damagochi-eye right"></span>
                            <span class="damagochi-smile"></span>
                            <span class="damagochi-cheek left"></span><span class="damagochi-cheek right"></span>
                        </div>
                    </div>
                    <div class="damagochi-shadow" aria-hidden="true"></div>
                    <span class="damagochi-effect damagochi-food" aria-hidden="true">🍎</span>
                    <span class="damagochi-effect damagochi-heart first" aria-hidden="true">♥</span>
                    <span class="damagochi-effect damagochi-heart second" aria-hidden="true">♥</span>
                    <div class="damagochi-effect damagochi-bath" aria-hidden="true">
                        <span class="damagochi-shower">🚿</span>
                        <span class="damagochi-drop"></span><span class="damagochi-drop second"></span><span class="damagochi-drop third"></span>
                        <span class="damagochi-bubble"></span><span class="damagochi-bubble second"></span>
                        <span class="damagochi-bubble third"></span><span class="damagochi-bubble fourth"></span>
                    </div>
                    <span id="damagochi-reward" class="damagochi-effect damagochi-reward" aria-hidden="true"></span>
                </div>
                <div class="damagochi-exp-header">
                    <span>경험치</span>
                    <strong id="damagochi-exp">- / 100 EXP</strong>
                </div>
                <progress id="damagochi-exp-bar" class="damagochi-exp-bar" value="0" max="100" aria-label="다마고치 경험치"></progress>
                <p id="damagochi-exp-note" class="damagochi-exp-note">경험치 100을 모으면 레벨이 올라가요.</p>
            </section>

            <div>
                <section class="damagochi-panel" aria-labelledby="damagochi-care-title">
                    <h2 id="damagochi-care-title">다마고치 돌보기</h2>
                    <div class="damagochi-actions">
                        <button id="damagochi-feed-button" class="damagochi-action" type="button" onclick="careDamagochi('feed')">
                            <span aria-hidden="true">🍎</span><strong>먹이기</strong><small>100 P · +10 EXP</small>
                        </button>
                        <button id="damagochi-wash-button" class="damagochi-action" type="button" onclick="careDamagochi('wash')">
                            <span aria-hidden="true">🫧</span><strong>씻기</strong><small>100 P · +10 EXP</small>
                        </button>
                    </div>
                </section>

                <section class="damagochi-panel" aria-labelledby="damagochi-name-title">
                    <h2 id="damagochi-name-title">이름 지어주기</h2>
                    <form class="damagochi-name-form" onsubmit="changeDamagochiName(event)">
                        <label for="damagochi-name-input">다마고치 이름 (1~30자)</label>
                        <div class="damagochi-name-row">
                            <input id="damagochi-name-input" type="text" placeholder="이름을 입력해주세요" required>
                            <button id="damagochi-name-button" class="damagochi-button" type="submit">변경</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <script src="./common.js"></script>
    <script>
        loadPoint();
        loadDamagochi();
    </script>
</body>
</html>
