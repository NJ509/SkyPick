<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .login-page {
            min-height: 100vh;
            background: #f6f8fa;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #fff;
            border: 1px solid #e9edf2;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .05);
        }

        .login-logo {
            display: block;
            margin-bottom: 30px;
            color: #20252b;
            font-size: 25px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
        }

        .login-card h1 {
            margin: 0;
            font-size: 23px;
            font-weight: 800;
            text-align: center;
        }

        .login-description {
            margin: 8px 0 28px;
            color: #9299a2;
            font-size: 12px;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .login-input-group label {
            color: #4f5862;
            font-size: 12px;
            font-weight: 700;
        }

        .login-input-group .form-control {
            height: 45px;
            border-color: #e1e6eb;
            border-radius: 8px;
            font-size: 12px;
        }

        .login-input-group .form-control:focus {
            border-color: #20252b;
            box-shadow: none;
        }

        .login-button {
            height: 45px;
            margin-top: 4px;
            border: none;
            border-radius: 8px;
            background: #20252b;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: #343a40;
        }

        .login-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 25px;
            font-size: 11px;
        }

        .login-links span {
            color: #9299a2;
        }

        .login-links a {
            color: #20252b;
            font-weight: 700;
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body class="login-page">
<main class="login-container">
    <div class="login-card">
        <h1>로그인</h1>

        <form class="login-form">
            <div class="login-input-group">
                <label for="login-id">아이디</label>
                <input type="text" id="login-id" class="form-control" placeholder="아이디를 입력하세요">
            </div>

            <div class="login-input-group">
                <label for="login-password">비밀번호</label>
                <input type="password" id="login-password" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="login-button">로그인</button>
        </form>

        <div class="login-links">
            <span>아직 회원이 아니신가요?</span>
            <a href="./signup.html">회원가입</a>
        </div>
    </div>
</main>
</body>
</html>
