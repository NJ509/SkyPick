<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick - 예측 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="./home.html">SkyPick</a>

            <div class="navbar-nav">
                <a class="nav-link" href="./home.html">예측</a>
                <a class="nav-link" href="./prediction.html">예측 리스트</a>
                <a class="nav-link" href="./shop.html">상점</a>
                <a class="nav-link active" href="./collection.html">도감</a>
                <a class="nav-link" href="./ranking.html">랭킹</a>
            </div>

            <div class="user-info">
                <span class="point">1,250 P</span>
                <button class="profile-btn">프로필</button>
            </div>
        </div>
    </nav>

    <main class="container collection-container">
        <div class="collection-header">
            <div>
                <h1>도감</h1>
                <p>획득한 아이템을 확인하고 나만의 컬렉션을 완성해보세요.</p>
            </div>
            <div class="collection-progress">
                <span>수집 현황</span>
                <strong id="collection-count">3 / 12</strong>
            </div>
        </div>

        <div class="collection-tabs">
            <button class="collection-tab active">전체</button>
            <button class="collection-tab">칭호</button>
            <button class="collection-tab">프로필</button>
            <button class="collection-tab">테마</button>
        </div>

        <section class="collection-section">
            <div class="collection-section-header">
                <h2>칭호</h2>
                <span>1 / 4</span>
            </div>

            <div class="collection-grid">

                <div class="collection-item owned">
                    <div class="collection-image">이미지</div>
                    <h3>제우스</h3>
                    <p>부가 설명</p>
                    <span class="collection-state">보유</span>
                </div>

                <div class="collection-item locked">
                    <div class="collection-image">이미지</div>
                    <h3>인간 기상청</h3>
                    <p>부가 설명</p>
                    <span class="collection-state">미보유</span>
                </div>

                <div class="collection-item locked">
                    <div class="collection-image">이미지</div>
                    <h3>꿀벌</h3>
                    <p>부가 설명</p>
                    <span class="collection-state">미보유</span>
                </div>

                <div class="collection-item locked">
                    <div class="collection-image">이미지</div>
                    <h3>예감 적중</h3>
                    <p>부가 설명</p>
                    <span class="collection-state">미보유</span>
                </div>

            </div>
        </section>

        <section class="collection-section">
            <div class="collection-section-header">
                <h2>프로필</h2>
                <span>2 / 4</span>
            </div>

            <div class="collection-grid">

                <div class="collection-item owned">
                    <div class="collection-image">이미지</div>
                    <h3>고양이</h3>
                    <p>고양이 프로필</p>
                    <span class="collection-state">보유</span>
                </div>

                <div class="collection-item owned">
                    <div class="collection-image">이미지</div>
                    <h3>곰</h3>
                    <p>곰 프로필</p>
                    <span class="collection-state">보유</span>
                </div>

                <div class="collection-item locked">
                    <div class="collection-image">이미지</div>
                    <h3>여우</h3>
                    <p>여우 프로필</p>
                    <span class="collection-state">미보유</span>
                </div>

                <div class="collection-item locked">
                    <div class="collection-image">이미지</div>
                    <h3>토끼</h3>
                    <p>토끼 프로필</p>
                    <span class="collection-state">미보유</span>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
