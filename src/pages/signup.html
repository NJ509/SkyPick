<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick - 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .signup-page {
            min-height: 100vh;
            background: #f6f8fa;
        }

        .signup-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 430px;
            padding: 35px 40px;
            background: #fff;
            border: 1px solid #e9edf2;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .05);
        }

        .signup-logo {
            display: block;
            margin-bottom: 25px;
            color: #20252b;
            font-size: 25px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
        }

        .signup-card h1 {
            margin: 0;
            font-size: 23px;
            font-weight: 800;
            text-align: center;
        }

        .signup-description {
            margin: 8px 0 24px;
            color: #9299a2;
            font-size: 12px;
            text-align: center;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .signup-input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .signup-input-group label {
            color: #4f5862;
            font-size: 12px;
            font-weight: 700;
        }

        .signup-input-group .form-control {
            height: 43px;
            border-color: #e1e6eb;
            border-radius: 8px;
            font-size: 12px;
        }

        .signup-input-group .form-control:focus {
            border-color: #20252b;
            box-shadow: none;
        }

        .signup-id-input {
            display: flex;
            gap: 7px;
        }

        .signup-id-input .form-control {
            flex: 1;
        }

        .duplicate-button {
            width: 75px;
            border: 1px solid #e1e6eb;
            border-radius: 8px;
            background: #f6f8fa;
            color: #59636e;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .duplicate-button:hover {
            background: #eef1f4;
        }

        .signup-button {
            height: 45px;
            margin-top: 4px;
            border: none;
            border-radius: 8px;
            background: #20252b;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .signup-button:hover {
            background: #343a40;
        }

        .signup-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 22px;
            font-size: 11px;
        }

        .signup-links span {
            color: #9299a2;
        }

        .signup-links a {
            color: #20252b;
            font-weight: 700;
            text-decoration: none;
        }

        .signup-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body class="signup-page">
<main class="signup-container">
    <div class="signup-card">
        <h1>회원가입</h1>

            <form class="signup-form" action="./mapSelect.html">
                <div class="signup-input-group">
                <label for="signup-id">아이디</label>
                <div class="signup-id-input">
                    <input type="text" id="signup-id" class="form-control" placeholder="아이디를 입력하세요">
                    <button type="button" class="duplicate-button">중복 확인</button>
                </div>
            </div>

            <div class="signup-input-group">
                <label for="signup-password">비밀번호</label>
                <input type="password" id="signup-password" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>

            <div class="signup-input-group">
                <label for="signup-password-check">비밀번호 확인</label>
                <input type="password" id="signup-password-check" class="form-control" placeholder="비밀번호를 다시 입력하세요">
            </div>

            <div class="signup-input-group">
                <label for="signup-nickname">닉네임</label>
                <input type="text" id="signup-nickname" class="form-control" placeholder="닉네임을 입력하세요">
            </div>

            <button type="submit" class="signup-button">회원가입</button>
        </form>

        <div class="signup-links">
            <span>이미 계정이 있으신가요?</span>
            <a href="./login.html">로그인</a>
        </div>
    </div>
</main>
</body>
</html>
