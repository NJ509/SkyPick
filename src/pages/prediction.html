<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick - 예측 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .prediction-list-container {
            height: calc(100vh - 70px);
            padding: 30px;
            overflow: hidden;
        }

        .prediction-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .prediction-list-header h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 800;
        }

        .prediction-list-header p {
            margin: 6px 0 0;
            color: #2563eb;
            font-size: 13px;
        }

        .prediction-filter {
            width: 130px;
            height: 40px;
        }

        .prediction-list {
            height: calc(100% - 85px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .prediction-list-card {
            flex-shrink: 0;
            padding: 20px 22px;
            background: #ffffff;
            border: 1px solid #e9edf2;
            border-radius: 14px;
        }

        .prediction-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 1px solid #eef1f4;
        }

        .prediction-region {
            margin-right: 12px;
            font-size: 17px;
            font-weight: 800;
        }

        .prediction-time {
            color: #9299a2;
            font-size: 12px;
        }

        .prediction-status {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-progress {
            background: #f0f4f8;
            color: #59636e;
        }

        .status-success {
            background: #eef7f1;
            color: #3d7a52;
        }

        .status-fail {
            background: #f8eeee;
            color: #a35a5a;
        }

        .prediction-card-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding-top: 15px;
        }

        .prediction-card-info div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .prediction-card-info span {
            color: #9299a2;
            font-size: 11px;
        }

        .prediction-card-info strong {
            font-size: 14px;
        }

        .prediction-list::-webkit-scrollbar {
            width: 5px;
        }

        .prediction-list::-webkit-scrollbar-thumb {
            background: #d9dee3;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .prediction-list-container {
                height: auto;
                min-height: calc(100vh - 70px);
                padding: 20px 15px;
                overflow: visible;
            }

            .prediction-list-header {
                align-items: flex-start;
                gap: 15px;
            }

            .prediction-list {
                height: auto;
                overflow: visible;
            }

            .prediction-card-info {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="./home.html">SkyPick</a>

            <div class="navbar-nav">
                <a class="nav-link" href="./home.html">예측</a>
                <a class="nav-link active" href="./prediction.html">예측 리스트</a>
                <a class="nav-link" href="./shop.html">상점</a>
                <a class="nav-link" href="./collection.html">도감</a>
                <a class="nav-link" href="./ranking.html">랭킹</a>
            </div>

            <div class="user-info">
                <span id="user-point" class="point">- P</span>
                <button class="profile-btn">프로필</button>
            </div>
        </div>
    </nav>

    <main class="container prediction-list-container">
        <div class="prediction-list-header">
            <div>
                <h1>예측 리스트</h1>
                <p>내가 진행한 예측을 확인해보세요.</p>
            </div>
            <select class="form-select prediction-filter" id="prediction-filter">
                <option>전체</option>
                <option>진행중</option>
                <option>성공</option>
                <option>실패</option>
            </select>
        </div>

        <div id="prediction-list" class="prediction-list">
            <p class="text-center text-muted">예측 목록을 불러오는 중...</p>
        </div>
    </main>
    <script type="module" src="./predictionList.js"></script>
    <script src="./common.js"></script>
    <script>
        loadPoint();
    </script>
</body>
</html>
