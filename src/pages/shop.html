<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPick - 상점</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .shop-container {
            min-height: calc(100vh - 72px);
            height: auto;
            padding: 25px 30px;
            overflow: visible;
        }

        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .shop-header h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 800;
        }

        .shop-header p {
            margin: 6px 0 0;
            color: #2563eb;
            font-size: 13px;
        }

        .shop-point {
            min-width: 150px;
            padding: 10px 16px;
            border: 1px solid #e9edf2;
            border-radius: 10px;
            background: #fff;
            text-align: right;
        }

        .shop-point span {
            display: block;
            margin-bottom: 3px;
            color: #9299a2;
            font-size: 11px;
        }

        .shop-point strong {
            font-size: 16px;
        }

        .shop-content {
            height: auto;
            display: block;
        }

        .shop-section {
            margin-bottom: 24px;
        }

        .shop-section-header {
            margin-bottom: 10px;
        }

        .shop-section-header h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
        }

        .shop-section-header p {
            margin: 3px 0 0;
            color: #9299a2;
            font-size: 11px;
        }

        .shop-items {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .shop-item {
            min-width: 0;
            padding: 16px;
            background: #ffffff;
            border: 1px solid #e9edf2;
            border-radius: 13px;
        }

        .shop-item-image {
            height: 90px;
            margin-bottom: 12px;
            border-radius: 10px;
            background: #f5f7f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .shop-item-info h3 {
            margin: 0 0 5px;
            font-size: 14px;
            font-weight: 800;
        }

        .shop-item-info p {
            height: 32px;
            margin: 0;
            color: #9299a2;
            font-size: 10px;
            line-height: 16px;
        }

        .shop-item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .shop-item-bottom strong {
            font-size: 13px;
        }

        .shop-buy-button {
            min-width: 55px;
            height: 30px;
            padding: 0 10px;
            border: none;
            border-radius: 7px;
            background: #20252b;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .shop-buy-button:hover {
            background: #343a40;
        }

        @media (max-width: 991px) {
            .shop-container {
                height: auto;
                min-height: calc(100vh - 70px);
                overflow: visible;
            }

            .shop-content {
                height: auto;
            }

            .shop-items {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .shop-container {
                padding: 20px 15px;
            }

            .shop-header {
                align-items: flex-start;
                gap: 15px;
            }

            .shop-point {
                min-width: 120px;
            }

            .shop-items {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="./home.html">SkyPick</a>

            <div class="navbar-nav">
                <a class="nav-link" href="./home.html">예측</a>
                <a class="nav-link" href="./prediction.html">예측 리스트</a>
                <a class="nav-link active" href="./shop.html">상점</a>
                <a class="nav-link" href="./collection.html">도감</a>
                <a class="nav-link" href="./ranking.html">랭킹</a>
            </div>

            <div class="user-info">
                <span id="user-point" class="point">- P</span>
                <button class="profile-btn">프로필</button>
            </div>
        </div>
    </nav>

    <main class="container shop-container">
        <div class="shop-header">
            <div>
                <h1>상점</h1>
                <p>포인트를 사용해 다양한 아이템을 구매해보세요.</p>
            </div>
        </div>

        <p id="shop-message" role="status"></p>

        <div class="shop-content">
            <section class="shop-section">
                <div class="shop-section-header">
                    <h2>꾸미기</h2>
                    <p>나만의 프로필을 꾸며보세요.</p>
                </div>
                <div id="shop-decorate-grid" class="shop-items"></div>
            </section>

            <section class="shop-section">
                <div class="shop-section-header">
                    <h2>플레이</h2>
                    <p>플레이에 사용할 아이템을 구매해보세요.</p>
                </div>
                <div id="shop-play-grid" class="shop-items"></div>
            </section>
        </div>
    </main>

    <script src="./common.js"></script>
    <script>
        loadShop();
    </script>

</body>
</html>
